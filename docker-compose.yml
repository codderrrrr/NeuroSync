services:
  postgres:
    image: postgres:16-alpine
    container_name: neurosync-postgres
    environment:
      POSTGRES_USER: neurosync
      POSTGRES_PASSWORD: neurosync
      POSTGRES_DB: neurosync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurosync -d neurosync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: