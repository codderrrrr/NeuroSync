name: neurosync_patient
description: NeuroSync patient application - create an account, sign in, view your profile and request to link with your doctor.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material controls fall back to Cupertino glyphs for their text
  # selection menus. Without the font those icons draw as blank boxes.
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  # The design system, networking, session handling and sign-in lifecycle
  # shared with the other application.
  neurosync_core:
    path: ../../packages/neurosync_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
