name: neurosync_doctor
description: NeuroSync doctor application - create an account, share your link code, accept patient requests and assign finger-tapping exercises.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material controls fall back to Cupertino glyphs for their text
  # selection menus. Without the font those icons draw as blank boxes.
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
